# Use AFTER the certificate has been issued. Apache 2.4.47+ required.
# Disable Certbot's generated translate-http-le-ssl.conf if enabling this file,
# so there is only ONE :443 virtual host for translate.playground.computer.
<VirtualHost *:443>
    ServerName translate.playground.computer
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/translate.playground.computer/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/translate.playground.computer/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass /device http://127.0.0.1:8787/device upgrade=websocket
    ProxyPassReverse /device http://127.0.0.1:8787/device
    ProxyPass /dashboard http://127.0.0.1:8787/dashboard upgrade=websocket
    ProxyPassReverse /dashboard http://127.0.0.1:8787/dashboard
    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog ${APACHE_LOG_DIR}/translate-error.log
    CustomLog ${APACHE_LOG_DIR}/translate-access.log combined
</VirtualHost>
