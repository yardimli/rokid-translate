# Enable this first, then run Certbot as described in DEPLOY.md.
<VirtualHost *:80>
    ServerName translate.playground.computer
    DocumentRoot /var/www/translate-acme
    <Directory /var/www/translate-acme>
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/translate-error.log
    CustomLog ${APACHE_LOG_DIR}/translate-access.log combined
</VirtualHost>
